# Name of the container image.
image: nameemhq/nameem-production

# Deploy to these servers.
servers:
  web:
    hosts:
      - 95.217.222.203
  job:
    hosts:
      - 95.217.222.203
    cmd: bundle exec bin/jobs


# Inject ENV variables into containers (secrets come from .env).
# Remember to run `kamal env push` after making changes!
env:
  clear:
    DB_HOST: 65.109.14.124
    RAILS_MAX_THREADS: 10
  secret:
    - RAILS_MASTER_KEY
    - MYSQL_USERNAME
    - MYSQL_ROOT_PASSWORD
    - SENTRY_DSN
    - PLAUSIBLE_API_KEY

builder:
  dockerfile: Dockerfile

accessories:
  db:
    options:
      memory: 4G
    host: 65.109.14.124
    files:
      - infrastucture/mysql/production.sql:/docker-entrypoint-initdb.d/setup.sql
      - infrastucture/mysql/production.cnf:/etc/mysql/conf.d/my.cnf

proxy:
  ssl: false
  host: nameem.com
  app_port: 3000
  healthcheck:
    interval: 3
    path: /up
    timeout: 3
