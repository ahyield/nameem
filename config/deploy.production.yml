# Name of the container image.
image: nameemhq/nameem-production

# Deploy to these servers.
servers:
  web:
    hosts:
      - 203.0.113.10
    labels:
      traefik.http.routers.nameem.rule: Host(`nameem.com`)
      traefik.http.routers.nameem_secure.entrypoints: websecure
      traefik.http.routers.nameem_secure.rule: Host(`nameem.com`)
      traefik.http.routers.nameem_secure.tls: true
      traefik.http.routers.nameem_secure.tls.certresolver: letsencrypt
  job:
    hosts:
      - 203.0.113.10
    cmd: bundle exec bin/jobs


# Inject ENV variables into containers (secrets come from .env).
# Remember to run `kamal env push` after making changes!
env:
  clear:
    DB_HOST: 203.0.113.20
    RAILS_MAX_THREADS: 10
  secret:
    - RAILS_MASTER_KEY
    - MYSQL_USERNAME
    - MYSQL_ROOT_PASSWORD
    - SENTRY_DSN

builder:
  dockerfile: Dockerfile

accessories:
  db:
    options:
      memory: 4G
    host: 203.0.113.20
    files:
      - infrastucture/mysql/production.sql:/docker-entrypoint-initdb.d/setup.sql
      - infrastucture/mysql/production.cnf:/etc/mysql/conf.d/my.cnf

  prometheus:
    host: 203.0.113.10

  otel_collector:
    hosts:
     - 203.0.113.10
     - 203.0.113.20
  grafana:
    host: 203.0.113.10

  mysql_exporter:
    hosts:
      - 203.0.113.20
