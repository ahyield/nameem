# Deploy to these servers.
servers:
  web:
    hosts:
      - <%= ENV.fetch("WEB_HOST") %>
  job:
    hosts:
      - <%= ENV.fetch("WEB_HOST") %>
    cmd: bundle exec bin/jobs --recurring_schedule_file=config/schedule.yml -c config/recurring.yml


# Inject ENV variables into containers (secrets come from .env).
# Remember to run `kamal env push` after making changes!
env:
  clear:
    DB_HOST: <%= ENV.fetch("DB_HOST") %>
    RAILS_MAX_THREADS: 10
  secret:
    - RAILS_MASTER_KEY
    - MYSQL_USERNAME
    - MYSQL_ROOT_PASSWORD
    - SENTRY_DSN

builder:
  dockerfile: Dockerfile

accessories:
  db:
    options:
      memory: 4G
    host: <%= ENV.fetch("DB_HOST") %>
    files:
      - infrastucture/mysql/production.sql:/docker-entrypoint-initdb.d/setup.sql
      - infrastucture/mysql/production.cnf:/etc/mysql/conf.d/my.cnf

proxy:
  run:
    version: v0.9.2
  ssl: false
  host: nameem.com
  app_port: 3000
  healthcheck:
    interval: 3
    path: /up
    timeout: 3
