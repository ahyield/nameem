# Name of your application. Used to uniquely configure containers.
service: nameem

# Name of the container image.
image: nameemhq/nameem

# Deploy to these servers.
servers:

# Credentials for your image host.
registry:
  server: ghcr.io
  username: nameemhq

  # Always use an access token rather than real password when possible.
  password:
    - KAMAL_REGISTRY_PASSWORD

# Inject ENV variables into containers (secrets come from .env).
# Remember to run `kamal env push` after making changes!
env:
  clear:
    DB_HOST:
    RAILS_MAX_THREADS: 10
  secret:
    - RAILS_MASTER_KEY
    - MYSQL_USERNAME
    - MYSQL_ROOT_PASSWORD
    - SENTRY_DSN
    - HONEYBADGER_API_KEY

# Use accessory services (secrets come from .env).
accessories:
  db:
    image: mysql:8.0
    host:
    port: 3306
    options:
      memory: 4G
    env:
      clear:
        MYSQL_ROOT_HOST: '%'
      secret:
        - MYSQL_USERNAME
        - MYSQL_ROOT_PASSWORD
    files:
      - infrastucture/mysql/production.cnf:/etc/mysql/conf.d/my.cnf
      - infrastucture/mysql/production.sql:/docker-entrypoint-initdb.d/setup.sql
    directories:
      - data:/var/lib/mysql

  prometheus:
    image: prom/prometheus:v2.54.1
    host:
    port: 9090
    options:
      memory: 4G
      user: 0
    cmd: --config.file=/etc/prometheus/web.yml --storage.tsdb.path=/prometheus --storage.tsdb.retention.time=90d
    files:
      - infrastucture/prometheus/web.yml:/etc/prometheus/web.yml
    directories:
      - data:/prometheus
    labels:
      traefik.http.routers.prometheus.rule: Host(`prometheus.nameem.net`)
      traefik.http.routers.prometheus_secure.entrypoints: websecure
      traefik.http.routers.prometheus_secure.rule: Host(`prometheus.nameem.net`)
      traefik.http.routers.prometheus_secure.tls: true
      traefik.http.routers.prometheus_secure.tls.certresolver: letsencrypt
      traefik.http.routers.prometheus.middlewares: prometheus-auth
      traefik.http.middlewares.prometheus-auth.basicauth.users: "admin:$apr1$6QwG.GVj$oqkrBTAxysBodgSGwTOfH0"

  otel_collector:
    image: otel/opentelemetry-collector:0.100.0
    hosts:
     -
    port: 9394
    options:
      memory: 1G
      user: 0
    files:
      - infrastucture/otel_collector/otel_collector.yml:/etc/otelcol/config.yaml
    labels:
      traefik.http.routers.otel-collector.rule: Host(`otel-collector.nameem.net`)
      traefik.http.routers.otel-collector_secure.entrypoints: websecure
      traefik.http.routers.otel-collector_secure.rule: Host(`otel-collector.nameem.net`)
      traefik.http.routers.otel-collector_secure.tls: true
      traefik.http.routers.otel-collector_secure.tls.certresolver: letsencrypt

  grafana:
    image: grafana/grafana:11.2.0
    host:
    port: 3030
    options:
      memory: 4G
      user: 0
    files:
      - infrastucture/grafana/grafana.ini:/etc/grafana/grafana.ini
      - infrastucture/grafana/provisioning.yml:/etc/grafana/provisioning.yml
    directories:
      - data:/var/lib/grafana
    labels:
      traefik.http.routers.grafana.rule: Host(`grafana.nameem.net`)
      traefik.http.routers.grafana_secure.entrypoints: websecure
      traefik.http.routers.grafana_secure.rule: Host(`grafana.nameem.net`)
      traefik.http.routers.grafana_secure.tls: true
      traefik.http.routers.grafana_secure.tls.certresolver: letsencrypt

traefik:
  image: traefik:v3.1.4
  options:
    publish:
      - "443:443"
    volume:
      - "/letsencrypt/acme.json:/letsencrypt/acme.json"
  args:
    # accesslog: true
    metrics.prometheus: "true"
    log.level: INFO
    accesslog.format: json
    accesslog.filters.statusCodes: "400-599"
    accesslog.filters.retryAttempts: true
    accesslog.filters.minDuration: 101ms
    entryPoints.web.address: ":80"
    entryPoints.websecure.address: ":443"
    certificatesResolvers.letsencrypt.acme.email: "tolpa1@gmail.com"
    certificatesResolvers.letsencrypt.acme.storage: "/letsencrypt/acme.json"
    certificatesResolvers.letsencrypt.acme.httpchallenge: true
    certificatesResolvers.letsencrypt.acme.httpchallenge.entrypoint: web
  labels:
    traefik.http.routers.catchall.entryPoints: web
