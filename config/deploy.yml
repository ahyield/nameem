# Name of your application. Used to uniquely configure containers.
service: nameem

# Name of the container image.
image: nameemhq/nameem

# Deploy to these servers.
servers:

builder:
  arch: amd64
  cache:
    type: registry
    options: mode=max,oci-mediatypes=true

asset_path: /rails/public/assets

# Credentials for your image host.
registry:
  server: ghcr.io
  username: nameemhq

  # Always use an access token rather than real password when possible.
  password:
    - KAMAL_REGISTRY_PASSWORD

# Inject ENV variables into containers (secrets come from .env).
# Remember to run `kamal env push` after making changes!
env:
  clear:
    DB_HOST:
    RAILS_MAX_THREADS: 10
  secret:
    - RAILS_MASTER_KEY
    - MYSQL_USERNAME
    - MYSQL_ROOT_PASSWORD
    - SENTRY_DSN
    - HONEYBADGER_API_KEY

# Use accessory services (secrets come from .env).
accessories:
  db:
    image: mysql:8.0
    host:
    port: 3306
    options:
      memory: 4G
    env:
      clear:
        MYSQL_ROOT_HOST: '%'
      secret:
        - MYSQL_USERNAME
        - MYSQL_ROOT_PASSWORD
    files:
      - infrastucture/mysql/production.cnf:/etc/mysql/conf.d/my.cnf
      - infrastucture/mysql/production.sql:/docker-entrypoint-initdb.d/setup.sql
    directories:
      - data:/var/lib/mysql

  prometheus:
    image: prom/prometheus:v2.54.1
    host:
    port: 9090
    options:
      memory: 4G
      user: 0
    cmd: --config.file=/etc/prometheus/web.yml --storage.tsdb.path=/prometheus --storage.tsdb.retention.time=90d
    env:
      secret:
        - PROMETHEUS_USER
        - PROMETHEUS_PASSWORD
    files:
      - infrastucture/prometheus/web.yml:/etc/prometheus/web.yml
    directories:
      - data:/prometheus

  otel_collector:
    image: otel/opentelemetry-collector:0.100.0
    hosts:
     -
    port: 9394
    options:
      memory: 1G
      user: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    files:
      - infrastucture/otel_collector/otel_collector.yml:/etc/otelcol/config.yaml

  grafana:
    image: grafana/grafana:11.2.0
    host:
    port: 3030
    env:
      secret:
        - GF_SECURITY_ADMIN_PASSWORD
        - GF_SECURITY_ADMIN_USER
        - GRAFANA_PROMETHEUS_PASSWORD
    options:
      memory: 4G
      user: 0
    files:
      - infrastucture/grafana/provisioning/dashboards/default.yaml:/etc/grafana/provisioning/dashboards/default.yaml
      - infrastucture/grafana/provisioning/datasources/provisioning.yaml:/etc/grafana/provisioning/datasources/provisioning.yaml
      - infrastucture/grafana/provisioning/dashboards/nodes/hetzner-nodes.json:/etc/grafana/provisioning/dashboards/nodes/hetzner-nodes.json
      - infrastucture/grafana/provisioning/dashboards/mysql/mysql-overview.json:/etc/grafana/provisioning/dashboards/mysql/mysql-overview.json
    directories:
      - data:/var/lib/grafana
      - infrastucture/grafana/provisioning/dashboards/mysql/*.json:/etc/grafana/provisioning/dashboards/mysql/*.json

  mysql_exporter:
    image: prom/mysqld-exporter
    hosts:
     - 
    port: 9104
    env:
      secret:
        - MYSQL_EXPORTER_PASSWORD
    options:
      user: 0
    cmd: --config.my-cnf=/.my.cnf
    files:
      - infrastucture/mysql/exporter.cnf.erb:/.my.cnf

proxy:
  ssl: true
  host: nameem.com
  app_port: 3000
  healthcheck:
    interval: 3
    path: /health
    timeout: 3
