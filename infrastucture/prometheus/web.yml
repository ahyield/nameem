global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['172.17.0.6:9394', '10.0.0.3:9394'] # second machine's private link

  - job_name: 'traefik'
    static_configs:
      - targets: ['172.17.0.2:8080']
