global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['nameem-otel_collector:9394']

  - job_name: 'grafana'
    static_configs:
      - targets: ['nameem-grafana:3030']

  - job_name: 'traefik'
    static_configs:
      - targets: ['traefik:8080']
