global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['10.0.0.2:9394', '10.0.0.3:9394'] # second machine's private link

  - job_name: 'traefik'
    static_configs:
      - targets: ['172.18.0.4:8080']

  - job_name: 'node_exporter'
    static_configs:
      - targets: ['10.0.0.2:9100', '10.0.0.3:9100'] # second machine's private link
