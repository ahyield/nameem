apiVersion: 1

providers:
  - name: Nodes
    folder: nodes
    type: file
    disableDeletion: true
    updateIntervalSeconds: 15
    allowUiUpdates: false
    options:
      path: /etc/grafana/provisioning/dashboards/nodes
  - name: Traefik
    folder: traefik
    type: file
    disableDeletion: true
    updateIntervalSeconds: 15
    allowUiUpdates: false
    options:
      path: /etc/grafana/provisioning/dashboards/traefik
  - name: Mysql
    folder: mysql
    type: file
    disableDeletion: true
    updateIntervalSeconds: 15
    allowUiUpdates: false
    options:
      path: /etc/grafana/provisioning/dashboards/mysql
