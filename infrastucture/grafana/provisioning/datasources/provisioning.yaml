apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: https://prometheus.nameem.net
    basicAuth: true
    basicAuthUser: admin
    isDefault: true
    jsonData:
      timeInterval: "10s"
    secureJsonData:
      basicAuthPassword: $GRAFANA_PROMETHEUS_PASSWORD
    version: 1
    editable: false
