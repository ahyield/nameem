name: Build & Deploy

inputs:
  kamal-registry-password:
    type: string
  environment:
    type: string

runs:
  using: composite
  steps:
    - name: Kamal Deploy
      shell: bash
      id: kamal-deploy
      env:
        KAMAL_REGISTRY_PASSWORD: ${{ inputs.kamal-registry-password }}
      run: |
        kamal deploy --destination=${{ inputs.environment }}

    - name: Kamal Release
      shell: bash
      if: ${{ cancelled() }}
      run: |
        kamal lock release --destination=${{ inputs.environment }}
