name: 02. Build & deploy Staging

permissions:
  id-token: write
  contents: read

on:
  push:
    branches:
      - staging

jobs:
  spec:
    uses: ./.github/workflows/_specs.yml
    secrets: inherit

  lint:
    uses: ./.github/workflows/_lint.yml
    secrets: inherit

  build_and_deploy:
    name: build-deploy-staging
    concurrency:
      group: staging_environment
      cancel-in-progress: true
    environment:
      name: staging
      url: https://staging.nameem.com
    needs:
      - spec
      - lint
    runs-on: buildjet-4vcpu-ubuntu-2204
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Pre Build
        uses: ./.github/workflows/pre-build
        with:
          rails-master-key: ${{ secrets.RAILS_MASTER_KEY }}
          kamal-registry-password: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}
          my-sql-root-password: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          rails-max-threads: ${{ secrets.RAILS_MAX_THREADS }}
          environment: staging

      - name: Build & Deploy
        uses: ./.github/workflows/build-deploy
        with:
          environment: staging
