name: 04. Kamal run command

permissions:
  id-token: write
  contents: read

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Commands'
        required: true
        type: choice
        options:
          - accessory reboot prometheus --destination=production
          - accessory reboot db --destination=production
          - accessory reboot otel_collector --destination=production
          - accessory reboot grafana --destination=production
          - accessory reboot mysql_exporter --destination=production

jobs:
  kamal_run_command:
    name: Kamal run command
    runs-on: blacksmith-4vcpu-ubuntu-2204	
    timeout-minutes: 20
    concurrency:
      group: ${{ github.event.inputs.environment }}_environment
      cancel-in-progress: false
    environment:
      name: ${{ github.event.inputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - uses: ./.github/workflows/pre-build
        name: Pre Build
        with:
          rails-master-key: ${{ secrets.RAILS_MASTER_KEY }}
          kamal-registry-password: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}
          my-sql-root-password: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          gf-security-admin-password: ${{ secrets.GF_SECURITY_ADMIN_PASSWORD }}
          grafana-prometheus-password: ${{ secrets.GRAFANA_PROMETHEUS_PASSWORD }}
          mysql-exporter-password: ${{ secrets.MYSQL_EXPORTER_PASSWORD }}
          prometheus-password: ${{ secrets.PROMETHEUS_PASSWORD }}
          my-sql-username: ${{ secrets.MYSQL_USERNAME }}
          rails-max-threads: ${{ env.RAILS_MAX_THREADS }}
          sentry-dsn: ${{ env.SENTRY_DSN }}
          environment: production

      - name: kamal ${{ github.event.inputs.command }}
        env:
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_USERNAME: ${{ secrets.MYSQL_USERNAME }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          gf-security-admin-password: ${{ secrets.GF_SECURITY_ADMIN_PASSWORD }}
          grafana-prometheus-password: ${{ secrets.GRAFANA_PROMETHEUS_PASSWORD }}
          mysql-exporter-password: ${{ secrets.MYSQL_EXPORTER_PASSWORD }}
          prometheus-password: ${{ secrets.PROMETHEUS_PASSWORD }}
          RAILS_MAX_THREADS: ${{ env.RAILS_MAX_THREADS }}
          SENTRY_DSN: ${{ env.SENTRY_DSN }}
        run: |
          kamal ${{ github.event.inputs.command }}
