name: 04. Kamal run command

permissions:
  id-token: write
  contents: read

on:
  workflow_dispatch:
    inputs:
      accessory:
        description: 'Accessory'
        required: true
        type: choice
        options:
          - db
          - prometheus
          - mysql_exporter
          - otel_collector
          - grafana
      command:
        description: 'Commands'
        required: true
        type: choice
        options:
          - accessory reboot ${{github.event.inputs.accessory}} --destination=${{ github.event.inputs.environment }}
          - env push --destination=${{ github.event.inputs.environment }}

      environment:
        description: 'Environment'
        required: true
        type: choice
        options:
          - production
          - staging

jobs:
  kamal_run_command:
    name: Kamal run command
    runs-on: buildjet-4vcpu-ubuntu-2204	
    timeout-minutes: 20
    concurrency:
      group: ${{ github.event.inputs.environment }}_environment
      cancel-in-progress: false
    environment:
      name: ${{ github.event.inputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - uses: ./.github/workflows/pre-build
        name: Pre Build
        with:
          rails-master-key: ${{ secrets.RAILS_MASTER_KEY }}
          kamal-registry-password: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}
          my-sql-root-password: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          my-sql-username: ${{ secrets.MYSQL_USERNAME }}
          rails-max-threads: ${{ env.RAILS_MAX_THREADS }}
          sentry-dsn: ${{ env.SENTRY_DSN }}
          environment: production

      - name: kamal ${{ github.event.inputs.command }} --destination=${{ github.event.inputs.environment }}
        env:
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_USERNAME: ${{ secrets.MYSQL_USERNAME }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          RAILS_MAX_THREADS: ${{ env.RAILS_MAX_THREADS }}
          SENTRY_DSN: ${{ env.SENTRY_DSN }}
        run: |
          kamal ${{ github.event.inputs.command }} --destination=${{ github.event.inputs.environment }}
