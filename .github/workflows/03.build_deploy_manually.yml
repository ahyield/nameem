name: 03. Deploy Manually

permissions:
  id-token: write
  contents: read

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - production
          - staging

jobs:
  build-production:
    name: deploy-production
    concurrency:
      group: production_environment
      cancel-in-progress: true
    environment:
      name: production
      url: https://nameem.com
    if: ${{ github.event.inputs.environment == 'production' }}

    runs-on: blacksmith-4vcpu-ubuntu-2204
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Pre Build
        uses: ./.github/workflows/pre-build
        with:
          rails-master-key: ${{ secrets.RAILS_MASTER_KEY }}
          kamal-registry-password: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}
          my-sql-root-password: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          my-sql-username: ${{ secrets.MYSQL_USERNAME }}
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          gf-security-admin-password: ${{ secrets.GF_SECURITY_ADMIN_PASSWORD }}
          grafana-prometheus-password: ${{ secrets.GRAFANA_PROMETHEUS_PASSWORD }}
          mysql-exporter-password: ${{ secrets.MYSQL_EXPORTER_PASSWORD }}
          prometheus-password: ${{ secrets.PROMETHEUS_PASSWORD }}
          rails-max-threads: ${{ env.RAILS_MAX_THREADS }}
          sentry-dsn: ${{ env.SENTRY_DSN }}
          environment: production

      - name: Build and Deploy
        uses: ./.github/workflows/build-deploy
        with:
          kamal-registry-password: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}
          environment: production

  build-staging:
    name: deploy-staging
    concurrency:
      group: staging_environment
      cancel-in-progress: true
    environment:
      name: staging
      url: https://staging.nameem.com
    if: ${{ github.event.inputs.environment == 'staging' }}
    runs-on: blacksmith-4vcpu-ubuntu-2204
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Pre Build
        uses: ./.github/workflows/pre-build
        with:
          rails-master-key: ${{ secrets.RAILS_MASTER_KEY }}
          kamal-registry-password: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}
          my-sql-root-password: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          my-sql-username: ${{ secrets.MYSQL_USERNAME }}
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          gf-security-admin-password: ${{ secrets.GF_SECURITY_ADMIN_PASSWORD }}
          grafana-prometheus-password: ${{ secrets.GRAFANA_PROMETHEUS_PASSWORD }}
          mysql-exporter-password: ${{ secrets.MYSQL_EXPORTER_PASSWORD }}
          prometheus-password: ${{ secrets.PROMETHEUS_PASSWORD }}
          rails-max-threads: ${{ env.RAILS_MAX_THREADS }}
          sentry-dsn: ${{ env.SENTRY_DSN }}
          environment: staging

      - name: Build and Deploy
        uses: ./.github/workflows/build-deploy
        with:
          environment: staging
