name: Pre-Build

inputs:
  rails-master-key:
    type: string
  kamal-registry-password:
    type: string
  ssh-private-key:
    type: string
  my-sql-root-password:
    type: string
  my-sql-username:
    type: string
  rails-max-threads:
    type: string
  sentry-dsn:
    type: string
  gf-security-admin-password:
    type: string
  grafana-prometheus-password:
    type: string
  mysql-exporter-password:
    type: string
  prometheus-password:
    type: string
  environment:
    type: string

runs:
  using: composite
  steps:
    - uses: webfactory/ssh-agent@v0.8.0
      with:
        ssh-private-key: ${{ inputs.ssh-private-key }}

    - uses: ruby/setup-ruby@v1
      env:
        BUNDLE_GEMFILE: ./Gemfile
      with:
        ruby-version: .ruby-version
        bundler-cache: true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Install dependencies
      shell: bash
      run: gem install bundler && bundle install && gem install kamal
