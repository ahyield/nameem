inherit_from: .rubocop_todo.yml
# Combine Exclude lists with the todo file instead of replacing them
inherit_mode:
  merge:
    - Exclude

plugins:
  - rubocop-rails
  - rubocop-rspec
  - rubocop-performance
AllCops:
  TargetRubyVersion: 4.0
  DisplayCopNames: true
  CacheRootDirectory: ".git"
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - node_modules/**/*
    - db/**/*
    - bin/**/*
    - vendor/**/*
    - tmp/**/*
    - coverage/**/*

Style/Documentation:
  Enabled: false

Lint/RaiseException:
  Enabled: true

Lint/StructNewOverride:
  Enabled: true

Metrics/AbcSize:
  Max: 29
  Severity: refactor

Metrics/BlockLength:
  Exclude:
    - spec/**/*
    - app/models/concerns/*
    - config/routes.rb
    - config/environments/*

Metrics/ClassLength:
  Exclude:
    - spec/**/*

Metrics/CyclomaticComplexity:
  Severity: refactor

Layout/LineLength:
  Max: 130
  Exclude:
    - Gemfile
  AllowCopDirectives: true
  # SVG icon path data can't be wrapped meaningfully
  AllowedPatterns:
    - 'd:\s+"M'
    - 'd="M'

# Policy specs naturally need several roles in scope
RSpec/MultipleMemoizedHelpers:
  Max: 8

Metrics/MethodLength:
  Enabled: true
  CountComments: false # count full line comments?
  Max: 18
  Severity: refactor

### Style / Layout
Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/FrozenStringLiteralComment:
  EnforcedStyle: never

Style/GuardClause:
  Enabled: false

Rails/I18nLocaleTexts:
  Enabled: false

Rails/SkipsModelValidations:
  Enabled: false

#### Hash
Layout/HashAlignment:
  EnforcedColonStyle: table
  EnforcedHashRocketStyle: table

Style/HashSyntax:
  EnforcedStyle: ruby19_no_mixed_keys

Style/HashEachMethods:
  Enabled: true

Style/HashTransformKeys:
  Enabled: false

Style/HashTransformValues:
  Enabled: false

#### MultilineOperation
Layout/MultilineOperationIndentation:
  Description: Checks indentation of binary operations that span more than one line.
  EnforcedStyle: indented
Style/DoubleNegation:
  Enabled: false

Style/ExponentialNotation:
  EnforcedStyle: engineering

Style/NumericLiterals:
  Description: Add underscores to large numeric literals to improve their readability.
  StyleGuide: https://github.com/bbatsov/ruby-style-guide#underscores-in-numerics
  Enabled: false

Style/PerlBackrefs:
  Enabled: false

Style/RaiseArgs:
  EnforcedStyle: compact

Style/RegexpLiteral:
  Enabled: false

Style/SignalException:
  EnforcedStyle: only_raise

Layout/SpaceAroundMethodCallOperator:
  Enabled: true

### RSpec

RSpec/ExampleLength:
  Enabled: false

RSpec/ExampleWording:
  IgnoredWords:
    - only
  CustomTransform:
    have: has

Rails/FilePath:
  Exclude:
    - spec/**/*

RSpec/MessageExpectation:
  Enabled: false

RSpec/MultipleExpectations:
  Enabled: false

RSpec/NamedSubject:
  Enabled: false

RSpec/NestedGroups:
  Enabled: false

# Flags every params[:slug]/params[:uuid] route parameter, which the router guarantees;
# strong-parameter calls already use params.expect.
Rails/StrongParametersExpect:
  Enabled: false

# Request specs describe flows, not classes
RSpec/DescribeClass:
  Exclude:
    - spec/views/**/*
    - spec/requests/**/*
    - spec/factories_spec.rb

RSpec/ContextWording:
  Prefixes:
    - when
    - with
    - without
    - as
    - for
    - if
